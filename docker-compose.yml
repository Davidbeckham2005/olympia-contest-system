services:
  app:
    build: .
    image: cuoc-thi:latest
    container_name: cuoc-thi
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_CLIENT=sqlite
      # BẮT BUỘC đặt: ADMIN_TOKEN bảo vệ khu vực ban tổ chức (/admin, /mc).
      # Dockerfile đã set NODE_ENV=production → không đặt token này thì BTC bị khóa (401).
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      # Giữ dữ liệu (SQLite) bền vững giữa các lần restart/redeploy
      - ./server/data:/app/server/data
      # Giữ media upload (hình/video hint) bền vững
      - ./server/uploads:/app/server/uploads
