<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Quiz Contest realtime architecture">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #13203a; stroke: #2a3d63; stroke-width: 1.5; }
      .wire { stroke: #4a6aa8; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; }
      .label { font: 600 13px system-ui, sans-serif; fill: #c9d6f2; }
      .label2 { font: 500 11px system-ui, sans-serif; fill: #8899c4; }
      .gold { fill: #ffd60a; }
      .text-dark { fill: #1a1400; }
      .text-white { fill: #ffffff; }
      .muted { fill: #8aa0c9; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="340" rx="18" />

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" class="label" font-size="18" fill="#ffffff">Quiz Contest — Realtime Architecture</text>
  <text x="450" y="52" text-anchor="middle" class="label2" font-size="12">1 server = single source of truth · Socket.IO broadcast</text>

  <!-- Server box (center) -->
  <rect x="370" y="100" width="160" height="120" rx="14" class="panel" />
  <rect x="370" y="100" width="160" height="34" rx="14" fill="#ffd60a" />
  <rect x="370" y="120" width="160" height="14" fill="#ffd60a" />
  <text x="450" y="122" text-anchor="middle" class="text-dark" font-weight="800" font-size="14">SERVER</text>
  <text x="450" y="156" text-anchor="middle" class="text-white" font-weight="700" font-size="13">Node · Express</text>
  <text x="450" y="174" text-anchor="middle" class="muted" font-size="12">Socket.IO · timers</text>
  <text x="450" y="192" text-anchor="middle" class="muted" font-size="12">PostgreSQL / SQLite</text>
  <!-- pulsing center dot -->
  <circle cx="450" cy="120" r="5" fill="#0b1120">
    <animate attributeName="r" values="3;9;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Client boxes -->
  <!-- MC desk (top) -->
  <rect x="376" y="10" width="148" height="56" rx="12" class="panel" />
  <text x="450" y="32" text-anchor="middle" class="label" font-weight="700">🎛️ MC Desk</text>
  <text x="450" y="50" text-anchor="middle" class="label2">/mc</text>
  <!-- Audience (left) -->
  <rect x="30" y="160" width="150" height="60" rx="12" class="panel" />
  <text x="105" y="186" text-anchor="middle" class="label" font-weight="700">🖥️ Audience / LED</text>
  <text x="105" y="204" text-anchor="middle" class="label2">/man-hinh</text>
  <!-- Contestant (right) -->
  <rect x="720" y="160" width="150" height="60" rx="12" class="panel" />
  <text x="795" y="186" text-anchor="middle" class="label" font-weight="700">👥 Contestants</text>
  <text x="795" y="204" text-anchor="middle" class="label2">/thi-sinh × N teams</text>
  <!-- Admin (bottom) -->
  <rect x="370" y="280" width="160" height="50" rx="12" class="panel" />
  <text x="450" y="303" text-anchor="middle" class="label" font-weight="700">⚙️ Admin</text>
  <text x="450" y="319" text-anchor="middle" class="label2">/admin</text>

  <!-- Connections (animated dashes) -->
  <!-- MC -> server -->
  <path class="wire" d="M 450 66 C 450 80, 450 88, 450 100">
    <animate attributeName="stroke-dashoffset" values="0;26" dur="1.2s" repeatCount="indefinite" />
  </path>
  <!-- audience -> server -->
  <path class="wire" d="M 180 190 C 250 190, 310 170, 370 160">
    <animate attributeName="stroke-dashoffset" values="0;26" dur="1.2s" repeatCount="indefinite" />
  </path>
  <!-- server -> contestant -->
  <path class="wire" d="M 530 160 C 590 170, 650 190, 720 190">
    <animate attributeName="stroke-dashoffset" values="0;26" dur="1.2s" repeatCount="indefinite" />
  </path>
  <!-- admin -> server -->
  <path class="wire" d="M 450 280 C 450 260, 450 245, 450 220">
    <animate attributeName="stroke-dashoffset" values="0;26" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Moving data packets along wires (light dots) -->
  <circle r="5" fill="#ffd60a">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 450 66 L 450 100" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle r="5" fill="#ffd60a">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 180 190 C 250 190, 310 170, 370 160" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle r="5" fill="#ffd60a">
    <animateMotion dur="2.0s" repeatCount="indefinite" path="M 720 190 C 650 190, 590 170, 530 160" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.0s" repeatCount="indefinite" />
  </circle>
  <circle r="5" fill="#ffd60a">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 450 220 L 450 280" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- Footer hint -->
  <text x="450" y="334" text-anchor="middle" class="label2" font-size="11">every screen stays in sync from the same game:state / game:timer events</text>
</svg>