# Render Blueprint — deploy Web Service bằng build command (không Docker).
#
# Phương án B: dùng database MySQL của Render (miễn phí, bền vững).
# Render Free KHÔNG có Persistent Disk, nên ta dùng MySQL thay cho SQLite
# để dữ liệu (điểm, câu hỏi, contestant, game state) không bị mất khi redeploy.
#
# Cách dùng:
#   1. Trên Render, tạo MySQL Database (New -> MySQL), lấy thông tin kết nối.
#   2. Deploy repo này qua Blueprint (Render đọc render.yaml). Sau đó vào tab
#      Environment của Web Service và điền giá trị thật cho:
#        DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL
#      (Hoặc dùng 1 biến DATABASE_URL dạng mysql://user:pass@host:3306/dbname.)
#   Các biến dưới có sync:false để Render không ghi đè giá trị bạn đã sửa.

services:
  - type: web
    name: cuoc-thi
    runtime: node
    plan: free
    buildCommand: npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_CLIENT
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
