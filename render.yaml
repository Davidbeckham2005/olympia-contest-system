# Render Blueprint — deploy Web Service bằng build command (không Docker).
#
# Phương án C (đã chọn): dùng database PostgreSQL của Render (miễn phí, bền vững).
# Render Free KHÔNG có Persistent Disk và KHÔNG có MySQL managed -> dùng Postgres
# managed (free tier) để dữ liệu không bị mất khi redeploy.
#
# Blueprint này:
#   - Tạo 1 PostgreSQL miễn phí (databases.cuoc-thi-db)
#   - Tạo Web Service, tự đưa DATABASE_URL (connection string) vào env
#   - DB_CLIENT=postgres để server dùng driver pg
#
# Deploy:
#   1. Đẩy repo lên GitHub.
#   2. Trên Render: New -> Blueprint, chọn repo (Render đọc render.yaml này).
#   3. Render tạo luôn cả Postgres lẫn Web Service.

databases:
  - name: cuoc-thi-db
    databaseName: cuoc_thi
    user: cuoc_thi
    plan: free

services:
  - type: web
    name: cuoc-thi
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_CLIENT
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cuoc-thi-db
          property: connectionString