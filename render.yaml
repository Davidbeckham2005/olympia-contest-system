# Render Blueprint — deploy Web Service bằng build command (không Docker).
#
# Yêu cầu triển khai:
#   - Node >= 22.13 (node:sqlite ổn định, không cần flag)
#   - Persistent Disk mount vào /app/data và trỏ DB_PATH vào đó để giữ file SQLite
#     qua mỗi redeploy. Mount ở /app/data (KHÔNG phải /app/server/data) vì thư mục
#     server/data còn chứa các file câu hỏi mặc định (questions-*.json); nếu mount
#     disk rỗng đè lên đó, server sẽ không đọc được câu hỏi và crash.
#   - Media sau này lưu ở Cloudflare R2 (không lưu trên server), nên không cần
#     mount disk cho /app/server/uploads.
#
# Deploy:
#   1. Đẩy repo lên GitHub.
#   2. Trên Render: New -> Blueprint, chọn repo (Render đọc file render.yaml này).
#   3. Render tạo Web Service tự động.

services:
  - type: web
    name: cuoc-thi
    runtime: node
    plan: free
    buildCommand: npm install --prefix client && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_CLIENT
        value: sqlite
      - key: DB_PATH
        value: /app/data/cuoc_thi.sqlite
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
